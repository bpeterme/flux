name: Release

on:
  push:
    branches: [main]

# GitHub occasionally delivers a push event twice. Runs queue up instead of
# racing, and a run whose commit already has a release tag stops early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip when this commit is already released
        id: guard
        run: |
          git fetch --tags --force --quiet
          tag=$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' | head -1 || true)
          if [[ -n "$tag" ]]; then
            echo "Already released as ${tag} — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install bats-core
        if: steps.guard.outputs.skip != 'true'
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          bats tests/unit.bats tests/post_checkout.bats
          bats tests/integration.bats

      - name: Generate CalVer tag
        if: steps.guard.outputs.skip != 'true'
        id: calver
        run: |
          DATE=$(date -u +%Y.%m.%d)
          LATEST=$(git tag --list "${DATE}.*" | sort -t. -k4 -n | tail -1)
          if [[ -z "$LATEST" ]]; then
            N=0
          else
            N=$(( ${LATEST##*.} + 1 ))
          fi
          TAG="${DATE}.${N}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.calver.outputs.tag }}"
          git push origin "${{ steps.calver.outputs.tag }}"

      - name: Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.tag }}
          generate_release_notes: true

      - name: Compute tarball SHA256
        if: steps.guard.outputs.skip != 'true'
        id: sha
        run: |
          TAG="${{ steps.calver.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        if: steps.guard.outputs.skip != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.calver.outputs.tag }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="${{ steps.sha.outputs.url }}"

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/bpeterme/homebrew-flux.git" /tmp/homebrew-flux
          cd /tmp/homebrew-flux

          # Copy the whole formula — tap is a mirror, flux repo is the source of truth
          cp "$GITHUB_WORKSPACE/Formula/flux.rb" Formula/flux.rb

          # Uncomment and fill in the stable release fields
          sed -i "s|# url    \".*\"|url    \"${URL}\"|" Formula/flux.rb
          sed -i "s|# sha256 \".*\"|sha256  \"${SHA}\"|" Formula/flux.rb
          sed -i "s|# version \".*\"|version \"${TAG}\"|" Formula/flux.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/flux.rb
          git commit -m "flux ${TAG}"
          git push
